{% extends 'base.html' %}
{% block content %}
<div class="card shadow">
<div class="card-header bg-warning text-dark"><h4 class="mb-0">تعديل بيانات المريض: {{ patient.full_name }}</h4></div>
<div class="card-body">
<form method="POST">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">الاسم الكامل *</label><input type="text" name="full_name" class="form-control" value="{{ patient.full_name }}" required></div>
<div class="col-md-3"><label class="form-label">العمر</label><input type="number" name="age" class="form-control" value="{{ patient.age or '' }}"></div>
<div class="col-md-3"><label class="form-label">الجنس</label>
<select name="gender" class="form-select"><option value="">-- اختر --</option>
<option value="ذكر" {% if patient.gender=='ذكر' %}selected{% endif %}>ذكر</option>
<option value="أنثى" {% if patient.gender=='أنثى' %}selected{% endif %}>أنثى</option></select></div>
<div class="col-md-6"><label class="form-label">العنوان</label><input type="text" name="address" class="form-control" value="{{ patient.address or '' }}"></div>
<div class="col-md-6"><label class="form-label">رقم الهاتف</label><input type="text" name="phone" class="form-control" value="{{ patient.phone or '' }}"></div>
<div class="col-md-6"><label class="form-label">نوع المرض</label>
<select name="disease_type" class="form-select"><option value="">-- اختر --</option>
{% for t in ['رئوي','خارج الرئة','مقاوم للأدوية MDR'] %}<option value="{{ t }}" {% if patient.disease_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}
</select></div>
<div class="col-md-6"><label class="form-label">الحالة</label>
<select name="status" class="form-select">
{% for s in ['قيد العلاج','متعافي','منقطع','متوفى'] %}<option value="{{ s }}" {% if patient.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
</select></div>
<div class="col-md-4"><label class="form-label">تاريخ بدء العلاج</label><input type="date" name="treatment_start" class="form-control" value="{{ patient.treatment_start or '' }}"></div>
<div class="col-md-4"><label class="form-label">تاريخ نهاية العلاج</label><input type="date" name="treatment_end" class="form-control" value="{{ patient.treatment_end or '' }}"></div>
<div class="col-md-4"><label class="form-label">تاريخ آخر زيارة</label><input type="date" name="last_visit" class="form-control" value="{{ patient.last_visit or '' }}"></div>
<div class="col-12"><label class="form-label">ملاحظات</label><textarea name="notes" class="form-control" rows="3">{{ patient.notes or '' }}</textarea></div>
</div>
<div class="mt-4"><button class="btn btn-warning btn-lg">حفظ التعديلات</button> <a href="{{ url_for('admin') }}" class="btn btn-secondary btn-lg">إلغاء</a></div>
</form>
</div>
</div>
{% endblock %}
